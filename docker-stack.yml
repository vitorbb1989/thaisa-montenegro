version: "3.8"

services:
  web:
    image: thaisamontenegro-site:${IMAGE_TAG:?IMAGE_TAG is required}
    networks:
      - minha_rede
    deploy:
      replicas: 1
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: stop-first
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=minha_rede"
        - "traefik.http.routers.thaisamontenegro.rule=Host(`espacothaisamontenegro.com.br`)"
        - "traefik.http.routers.thaisamontenegro.entrypoints=websecure"
        - "traefik.http.routers.thaisamontenegro.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.thaisamontenegro.loadbalancer.server.port=80"

networks:
  minha_rede:
    external: true
