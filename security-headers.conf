add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header X-Frame-Options "DENY" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' https://fonts.googleapis.com; script-src 'self' 'sha256-S1c5+ZmsSjg6j8Ojp0gzD1BOVFAMl/WpZbPZYcfAQw8='; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Se o Pixel da Meta for ativado em script.js (ver comentário no arquivo), some com:
#   script-src ... https://connect.facebook.net
#   img-src ... https://www.facebook.com
#   connect-src ... https://www.facebook.com
