server_tokens off;

server {
    listen 80;
    server_name lp.thaisamontenegro.com.br;

    root /usr/share/nginx/html;
    index index.html;

    autoindex off;

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~* \.(?:css|js|svg|webp|png)$ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.html$ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /robots.txt {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        internal;
        return 404 "404 Not Found\n";
    }
}
